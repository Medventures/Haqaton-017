server {
    listen 80;
    listen [::]:80;
    server_name medhub.ych.kz;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://medhub.ych.kz$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name medhub.ych.kz;
    ssl_certificate /etc/letsencrypt/live/medhub.ych.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/medhub.ych.kz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:medhubSSL:10m;
    ssl_session_tickets off;
    server_tokens off;

    # Путь к собранному Vue UI; backend ниже, на отдельном порту.
    root /opt/medhub/current/ui;
    index index.html;
    client_max_body_size 100m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "microphone=(self), camera=()" always;
    location = /nginx-health { access_log off; default_type text/plain; return 200 "medhub ok\n"; }
    location /api/ {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        # URL поиска может содержать ИИН, поэтому access log API выключен.
        access_log off;
    }
    # Медицинские PDF должны отдаваться авторизованным API, не public alias.
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
